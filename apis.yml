name: Material Evolution
description: Material Evolution is a UK-based cleantech manufacturer of ultra-low carbon cement for the
  construction industry. Its MevoCem and MevoXL products use a proprietary "Alkali Fusion" process to
  transform industrial byproducts into cement feedstocks, achieving a 52.5N strength rating at roughly
  144-196 kg CO2e per tonne versus ordinary Portland cement. The company operates compact, automated
  factories (including its Wrexham facility) and applies AI to material development and feedstock
  optimization. It is a B2B cement supplier and does not currently publish any public developer-facing
  API, developer portal, or technical documentation surface.
